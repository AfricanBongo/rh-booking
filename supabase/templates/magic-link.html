<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In to Royalhouse Booking</title>
</head>
<body style="margin:0;padding:0;background-color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f7f8;padding:48px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;">
          <!-- Logo -->
          <tr>
            <td style="padding:0 0 32px;text-align:center;">
              <span style="font-size:18px;font-weight:700;color:#1a1a2e;letter-spacing:-0.3px;">Royalhouse</span>
            </td>
          </tr>
          <!-- Card -->
          <tr>
            <td>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:16px;border:1px solid #e8e8ec;overflow:hidden;">
                <!-- Header gradient bar -->
                <tr>
                  <td style="height:4px;background:linear-gradient(90deg,#3b6bea 0%,#6b8ff7 100%);font-size:0;line-height:0;">&nbsp;</td>
                </tr>
                <!-- Content -->
                <tr>
                  <td style="padding:40px 36px;">
                    <h1 style="margin:0 0 8px;font-size:24px;font-weight:600;color:#1a1a2e;line-height:1.3;">Your sign-in link</h1>
                    <p style="margin:0 0 28px;font-size:15px;color:#6b7280;line-height:1.6;">
                      Click below to sign in to your Royalhouse Booking account. If you did not request this, you can safely ignore this email.
                    </p>
                    <!-- Button -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td align="center">
                          <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 36px;background-color:#1a1a2e;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:100px;letter-spacing:-0.2px;">
                            Sign In to Royalhouse Booking
                          </a>
                        </td>
                      </tr>
                    </table>
                    <!-- Expiry -->
                    <p style="margin:28px 0 0;font-size:13px;color:#9ca3af;text-align:center;line-height:1.5;">
                      This link expires in 10 minutes.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:28px 0 0;text-align:center;">
              <p style="margin:0 0 4px;font-size:12px;color:#9ca3af;">
                Royalhouse Chapel International
              </p>
              <p style="margin:0;font-size:11px;color:#c4c4cc;">
                Conference Booking Platform
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
